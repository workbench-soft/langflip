name: Release

# Builds langflip.exe beside Checks on a push to main and publishes it once they pass, with a date version like 2026.10.30.1, then 2026.10.30.2.
# A docs only push skips Checks, so it makes no release.
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!docs/**"]
  workflow_dispatch:

permissions:
  # wait-for-checks.sh reads the checks runs of the commit.
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.sha }}

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  release:
    # A run by hand from another branch would tag a commit no check passed, so it releases main only.
    if: github.ref == 'refs/heads/main'
    # The repo is public, so GitHub runners cost nothing and fork PRs stay off the PC.
    runs-on: windows-latest
    steps:
      - name: Check the release token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: test -n "$RELEASES_TOKEN" || { echo "Set the RELEASES_TOKEN secret, then run this workflow again." >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # Full history, since the notes and the next version need all past tags and commits.
          fetch-depth: 0
      # The repo is public, and a public repo can't use the private workbench-soft/ci actions.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # A restored cache left oxfmt without its tinypool dependency.
          cache: false

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build langflip.exe
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          LANGFLIP_VERSION="${TAG#v}" mise x -- cargo build --release -p langflip
          cp "target/release/langflip.exe" "Langflip-${TAG#v}-windows-x64.exe"

      - name: Wait for the checks run of this commit
        env:
          CHECKS_WORKFLOW: checks.yml
        run: sh .github/scripts/wait-for-checks.sh

      # Every app publishes to the workbench-soft.github.io repo, where the in-app updater looks.
      # Tags pushed with the workflow token don't trigger other workflows.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUBLIC_REPO: workbench-soft/workbench-soft.github.io
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          export GH_TOKEN="$RELEASES_TOKEN"
          gh release create "langflip-$TAG" "Langflip-${TAG#v}-windows-x64.exe" --repo "$PUBLIC_REPO" \
            --notes-file "$RUNNER_TEMP/notes.md" --title "Langflip $TAG"
          # Keep the last 3, as the other apps do.
          gh release list --repo "$PUBLIC_REPO" --limit 200 --json tagName --jq '.[].tagName' |
            grep '^langflip-v' | tail -n +4 | while read -r old; do
              gh release delete "$old" --repo "$PUBLIC_REPO" --cleanup-tag --yes
            done

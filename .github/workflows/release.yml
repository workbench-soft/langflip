name: Release

# Publishes langflip.exe after Checks passes on a push to main, with a date version like 2026.10.30.1, then 2026.10.30.2.
# A docs only push skips Checks, so it makes no release.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # Pins the commit Checks passed, since workflow_run starts on main's tip, which may be newer.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  # Holds the release while an agent session still has a PR open. Dependabot and PRs idle for 6 hours don't hold it.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.open.outputs.go }}
    steps:
      - id: open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,author,updatedAt --jq '[.[] | select((.author.is_bot | not) and (.updatedAt | fromdateiso8601) > now - 21600) | "#" + (.number | tostring)] | join(" ")')
          if [ -n "$open" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::notice::Release waits for the open PRs $open"
            echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One release at a time, so each sees the previous tag. A newer one cancels the running one, whose build is stale.
    concurrency:
      group: release
      cancel-in-progress: true
    # The repo is public, so GitHub runners cost nothing and fork PRs stay off the PC.
    runs-on: windows-latest
    steps:
      - name: Check the release token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: test -n "$RELEASES_TOKEN" || { echo "Set the RELEASES_TOKEN secret, then run this workflow again." >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # Full history, since the notes and the next version need all past tags and commits.
          fetch-depth: 0
      # The repo is public, and a public repo can't use the private workbench-soft/ci actions.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # A restored cache left oxfmt without its tinypool dependency.
          cache: false

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build langflip.exe
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          LANGFLIP_VERSION="${TAG#v}" mise x -- cargo build --release -p langflip
          cp "target/release/langflip.exe" "Langflip-${TAG#v}-windows-x64.exe"

      # Every app publishes to the workbench-soft.github.io repo, where the in-app updater looks.
      # Tags pushed with the workflow token don't trigger other workflows.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUBLIC_REPO: workbench-soft/workbench-soft.github.io
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          export GH_TOKEN="$RELEASES_TOKEN"
          gh release create "langflip-$TAG" "Langflip-${TAG#v}-windows-x64.exe" --repo "$PUBLIC_REPO" \
            --notes-file "$RUNNER_TEMP/notes.md" --title "Langflip $TAG"
          # Keep the last 3, as the other apps do.
          gh release list --repo "$PUBLIC_REPO" --limit 200 --json tagName --jq '.[].tagName' |
            grep '^langflip-v' | tail -n +4 | while read -r old; do
              gh release delete "$old" --repo "$PUBLIC_REPO" --cleanup-tag --yes
            done

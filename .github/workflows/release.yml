name: Release

# Release builds beside Checks, publishes once they pass on the commit, and stops when they fail.
# No job waits on a runner for the other workflow. release-gate.sh ties them together.
# A docs only push skips Checks, so it makes no release.
on:
  push:
    branches: [main]
    # The same paths as Checks, so a push they skip builds no release.
    paths: ["**", "!**.md", "!docs/**"]
  # The local-ci page starts it this way. A run by hand publishes once Checks of the commit passed.
  workflow_dispatch:
  # Checks ending publishes the build, or cancels it when they failed.
  workflow_run:
    workflows: [Checks]
    types: [completed]

# A newer push or run by hand cancels the older build of this workflow on GitHub's side.
# A workflow_run run publishes or cancels for one commit, so it gets a group of its own and runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.run_id || github.ref }}
  cancel-in-progress: true

# Each job widens this. The build runs the build scripts of every crate, so its token only reads.
permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  CHECKS_WORKFLOW: checks.yml
  RELEASE_WORKFLOW: release.yml
  # The files the build hands to publish, as cache paths.
  RELEASE_FILES: |
    release-tag
    Langflip-*-windows-x64.exe

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  build:
    # Builds beside Checks. A run by hand from another branch would build a commit no check passed.
    if: github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'
    # The repo is public, so GitHub runners cost nothing and fork PRs stay off the PC.
    runs-on: windows-latest
    # release-gate.sh reads the Checks runs of the commit.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check the release token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: test -n "$RELEASES_TOKEN" || { echo "Set the RELEASES_TOKEN secret, then run this workflow again." >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # Full history, since the notes and the next version need all past tags and commits.
          fetch-depth: 0
          # Keeps the token out of .git/config, where a build script could read it.
          persist-credentials: false

      # The repo is public, and a public repo can't use the private workbench-soft/ci actions.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # A restored cache left oxfmt without its tinypool dependency.
          cache: false
          # The lint tools run in Checks, so the build needs Rust alone.
          install_args: rust
      # Keeps the compiled crates between releases, so a change that leaves Cargo.lock alone builds only the Langflip crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build langflip.exe
        env:
          TAG: ${{ steps.version.outputs.tag }}
          # The build scripts of every crate run here, so they get no token.
          GH_TOKEN: ""
          # mise x would install the 9 lint tools first. The Rust from mise-action is all the build needs.
          MISE_EXEC_AUTO_INSTALL: "false"
        run: |
          LANGFLIP_VERSION="${TAG#v}" mise x -- cargo build --release -p langflip
          cp "target/release/langflip.exe" "Langflip-${TAG#v}-windows-x64.exe"
          ls -l "Langflip-${TAG#v}-windows-x64.exe"
      - name: Keep the tag with the files
        run: echo "${{ steps.version.outputs.tag }}" > release-tag
      # The publish job may run on another runner, so the files and the tag travel through the cache.
      # The artifact storage of the org is full, and the cache of each repo holds 10 GB.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: release-${{ github.run_id }}
          path: ${{ env.RELEASE_FILES }}
          enableCrossOsArchive: true
      # The last step, so a Checks run that ends after it starts publish through workflow_run.
      - name: Look up Checks of this commit once
        id: checks
        run: sh .github/scripts/release-gate.sh checks
    outputs:
      checks: ${{ steps.checks.outputs.checks }}

  publish:
    # Right after the build when Checks already passed, else once Checks pass on a push to main of this repo.
    needs: build
    if: >-
      !cancelled() && (needs.build.outputs.checks == 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)))
    # One publish at a time, so each sees the tag of the one before. A newer waiting one replaces an older waiting one.
    concurrency:
      group: release-publish
    # release-gate.sh reads the runs, and the step below pushes the tag.
    permissions:
      actions: read
      contents: write
    # The repo is public, so a GitHub runner costs 0 and fork code stays off the PC.
    runs-on: ubuntu-latest
    steps:
      # The release notes need every earlier tag and commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Find the build of this commit
        id: gate
        run: |
          if [ "${{ github.event_name }}" != workflow_run ]; then
            echo "run=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            sh .github/scripts/release-gate.sh build
          fi
      - if: steps.gate.outputs.run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: release-${{ steps.gate.outputs.run }}
          path: ${{ env.RELEASE_FILES }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # The steps below read the tag the build picked, as steps.version.outputs.tag.
      - name: Read the tag the build picked
        if: steps.gate.outputs.run
        id: version
        run: |
          git fetch --quiet --force --tags origin
          if [ -n "$(git tag --points-at "$SHA")" ]; then
            echo "$SHA has a release already: $(git tag --points-at "$SHA" | tr '\n' ' ')"
          else
            echo "tag=$(cat release-tag)" >> "$GITHUB_OUTPUT"
          fi

      # Every app publishes to the workbench-soft.github.io repo, where the in-app updater looks.
      # Tags pushed with the workflow token don't trigger other workflows.
      - name: Tag the commit and publish the release
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUBLIC_REPO: workbench-soft/workbench-soft.github.io
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          export GH_TOKEN="$RELEASES_TOKEN"
          gh release create "langflip-$TAG" "Langflip-${TAG#v}-windows-x64.exe" --repo "$PUBLIC_REPO" \
            --notes-file "$RUNNER_TEMP/notes.md" --title "Langflip $TAG"
          # Keep the last 3, as the other apps do.
          gh release list --repo "$PUBLIC_REPO" --limit 200 --json tagName --jq '.[].tagName' |
            grep '^langflip-v' | tail -n +4 | while read -r old; do
              gh release delete "$old" --repo "$PUBLIC_REPO" --cleanup-tag --yes
            done

  cancel:
    # release-gate.sh cancels the Release runs of the commit.
    permissions:
      actions: write
      contents: read
    # A failed Checks run stops the build of the same commit.
    if: >-
      github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    # The repo is public, so a GitHub runner costs 0 and fork code stays off the PC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: .github/scripts
      - run: sh .github/scripts/release-gate.sh cancel

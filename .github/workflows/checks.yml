name: Checks

# Format, clippy, tests and the macOS compile, the same steps as `mise run check`.
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!docs/**"]
  # The repo is public, so PRs from outside get checked too.
  pull_request:
    paths: ["**", "!**.md", "!docs/**"]
  workflow_dispatch:

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  check:
    # The repo is public, so GitHub runners cost nothing and fork PRs stay off the PC.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The repo is public, and a public repo can't use the private workbench-soft/ci actions.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # A restored cache left oxfmt without its tinypool dependency.
          cache: false
      - run: mise x -- rustup target add aarch64-apple-darwin
      - run: mise run check

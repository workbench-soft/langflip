name: Checks

# Format, clippy, tests and the macOS compile, the same steps as `mise run check`.
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!docs/**"]
  # PR runs are off: agents run the tests and linter locally before they merge.
  # To run this on PRs again, uncomment the pull_request lines below.
  # pull_request:
  #   paths: ['**', '!**.md', '!docs/**']
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  check:
    # A Gradle, Cargo or Tauri build takes every core. The heavy runners take at most 2 such jobs at once.
    runs-on: [self-hosted, heavy]
    steps:
      - uses: actions/checkout@v7
      - uses: workbench-soft/ci/actions/setup@main
        with:
          pnpm-install: "false"
      # The checkout deletes target, so the build goes to a folder that lasts and only changed crates build again.
      # It sits in the runner's work folder, which Defender skips. Under LOCALAPPDATA, Defender blocked a test exe.
      - run: echo "CARGO_TARGET_DIR=$(cygpath -m "$RUNNER_WORKSPACE")/target-checks" >> "$GITHUB_ENV"
      - run: mise x -- rustup target add aarch64-apple-darwin
      - run: mise run check

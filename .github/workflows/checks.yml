name: Checks

# Format, clippy, tests and the macOS compile, the same steps as `mise run check`.
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!docs/**"]
  # The repo is public, so PRs from outside get checked too.
  pull_request:
    paths: ["**", "!**.md", "!docs/**"]
  workflow_dispatch:

# A newer push to the same branch or PR cancels this run on GitHub's side.
# The local-ci page cancels the runs GitHub leaves, such as those of a merged PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  check:
    # The repo is public, so GitHub runners cost nothing and fork PRs stay off the PC.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The repo is public, and a public repo can't use the private workbench-soft/ci actions.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # A restored cache left oxfmt without its tinypool dependency.
          cache: false
      - run: mise x -- rustup target add aarch64-apple-darwin
      # Keeps the compiled crates between runs. Only main saves, so PR runs don't crowd out the release files in the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check

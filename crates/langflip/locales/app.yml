update.failed:
  en: Langflip could not update. It tries again tomorrow.
  ru: Langflip не смог обновиться. Он попробует завтра.
  de: Langflip konnte sich nicht aktualisieren. Es versucht es morgen wieder.
  fr: Langflip n’a pas pu se mettre à jour. Il réessaiera demain.
  es: Langflip no pudo actualizarse. Lo intentará mañana.
  zh: Langflip 更新失败。明天会再试。
  ja: Langflip を更新できませんでした。明日もう一度試します。
  ko: Langflip을 업데이트하지 못했어요. 내일 다시 시도해요.
  nb: Langflip kunne ikke oppdatere seg. Det prøver igjen i morgen.

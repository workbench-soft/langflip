menu.keepWordsNone:
  en: None yet. A word lands here after 2 undos
  ru: Пока нет. Слово попадает сюда после 2 отмен
  de: Noch keine. Ein Wort kommt nach 2 Rückgängig hierher
  fr: Aucune pour l’instant. Un mot arrive ici après 2 annulations
  es: Ninguna aún. Una palabra llega aquí tras 2 deshacer
  zh: 还没有。一个词被撤销 2 次后会出现在这里
  ja: まだありません。2 回元に戻した単語がここに入ります
  ko: 아직 없어요. 두 번 되돌린 단어가 여기 들어와요
  nb: Ingen ennå. Et ord havner her etter 2 angringer

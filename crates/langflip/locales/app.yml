_version: 2
tooltip.on:
  en: Langflip is on. A click turns it off, a double click switches the layout
  ru: Langflip включён. Щелчок выключает, двойной щелчок меняет раскладку
  de: Langflip ist an. Ein Klick schaltet es aus, ein Doppelklick wechselt das Layout
  fr: Langflip est activé. Un clic le désactive, un double clic change la disposition
  es: Langflip está activado. Un clic lo desactiva, un doble clic cambia la distribución
  zh: Langflip 已开启。单击关闭，双击切换键盘布局
  ja: Langflip はオンです。クリックでオフ、ダブルクリックでキー配列を切り替え
  ko: Langflip이 켜져 있어요. 클릭하면 꺼지고, 더블클릭하면 자판이 바뀌어요
  nb: Langflip er på. Et klikk slår det av, et dobbeltklikk bytter oppsett
tooltip.off:
  en: Langflip is off. A click turns it on, a double click switches the layout
  ru: Langflip выключен. Щелчок включает, двойной щелчок меняет раскладку
  de: Langflip ist aus. Ein Klick schaltet es ein, ein Doppelklick wechselt das Layout
  fr: Langflip est désactivé. Un clic l’active, un double clic change la disposition
  es: Langflip está desactivado. Un clic lo activa, un doble clic cambia la distribución
  zh: Langflip 已关闭。单击开启，双击切换键盘布局
  ja: Langflip はオフです。クリックでオン、ダブルクリックでキー配列を切り替え
  ko: Langflip이 꺼져 있어요. 클릭하면 켜지고, 더블클릭하면 자판이 바뀌어요
  nb: Langflip er av. Et klikk slår det på, et dobbeltklikk bytter oppsett

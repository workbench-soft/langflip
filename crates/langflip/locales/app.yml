update.details:
  en: Update downloads %{size} MB and restarts Langflip. The settings stay.
  ru: «Обновить» скачает %{size} МБ и перезапустит Langflip. Настройки останутся.
  de: „Aktualisieren“ lädt %{size} MB herunter und startet Langflip neu. Die Einstellungen bleiben.
  fr: « Mettre à jour » télécharge %{size} Mo et relance Langflip. Les réglages restent.
  es: «Actualizar» descarga %{size} MB y reinicia Langflip. Los ajustes se mantienen.
  zh: “更新”会下载 %{size} MB 并重启 Langflip。设置保持不变。
  ja: 「更新」で %{size} MB をダウンロードし、Langflip を再起動します。設定はそのままです。
  ko: 업데이트를 누르면 %{size} MB를 내려받고 Langflip을 다시 시작해요. 설정은 그대로예요.
  nb: «Oppdater» laster ned %{size} MB og starter Langflip på nytt. Innstillingene blir værende.

[tools]
rust = { version = "1.99", components = "rustfmt,clippy", targets = "aarch64-apple-darwin,x86_64-apple-darwin" }
python = "3.13"
uv = "0.13"

[tasks.model]
description = "Rebuild model/langflip.model and model/testset.tsv from wordfreq"
run = "uv run --no-project --with wordfreq==3.1.1 python scripts/build_model.py"

[tasks.check]
description = "Format, lint and test, the same steps CI runs"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "cargo check -p langflip --target aarch64-apple-darwin",
]

[tasks.tray-icons]
description = "Render the tray icons in crates/langflip/assets/tray from their SVGs"
dir = "crates/langflip/assets/tray"
run = [
  "mise x github:linebender/resvg@0.49.0 -- resvg -w 32 -h 32 en.svg en.png",
  "mise x github:linebender/resvg@0.49.0 -- resvg -w 32 -h 32 ru.svg ru.png",
  "mise x github:linebender/resvg@0.49.0 -- resvg -w 32 -h 32 other.svg other.png",
]

[tasks.eval]
description = "Score the model on model/testset.tsv"
run = "cargo run --release -p langflip-core --example evaluate"

[tasks.install]
description = "Build from this checkout and install it on this PC in place of the running Langflip (Windows)"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.ps1"

[tasks.smoke]
description = "Run Langflip and type into a test window (Windows, takes the keyboard for 10 seconds)"
run = ["cargo build -p langflip", "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-windows.ps1"]

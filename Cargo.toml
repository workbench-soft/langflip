[workspace]
resolver = "3"
members = ["crates/langflip-core", "crates/langflip"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/workbench-soft/langflip"

[profile.release]
# Thin LTO runs on every core, where fat LTO on one codegen unit ran on one.
lto = "thin"
strip = true
